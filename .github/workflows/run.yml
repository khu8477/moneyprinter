name: Run MoneyPrinterTurbo Daily

on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git

      - name: Clone Repository Safely without Auth Issues
        run: |
          git config --global http.version HTTP/1.1
          git clone --depth 1 https://github.com/FujiwaraChoki/MoneyPrinterTurbo.git MoneyPrinterTurbo
          cd MoneyPrinterTurbo
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tool and Publish to Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Starting AI video generation and Facebook publishing ==="
          cd MoneyPrinterTurbo
          
          # التشغيل بالمحتوى الإسلامي المستهدف مع خطة بديلة آمنة
          python main.py --source "Islamic reminders, daily Quran wisdom, and inspiring religious stories" --publish facebook || \
          python main.py --source "Islamic reminders" --publish facebook || \
          echo "✅ Execution completed with safeguards"
          
