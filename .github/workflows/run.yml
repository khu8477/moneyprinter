name: Run MoneyPrinterTurbo Daily

on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Clone MoneyPrinterTurbo Cleanly and Install Requirements
        run: |
          git config --global credential.helper ""
          git clone https://github.com/FujiwaraChoki/MoneyPrinterTurbo.git
          cd MoneyPrinterTurbo
          pip install -r requirements.txt

      - name: Run Tool and Publish to Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          echo "Starting video generation and publishing..."
          cd MoneyPrinterTurbo
          python main.py --source "Islamic reminders, daily Quran wisdom, and inspiring religious stories" --publish facebook || echo "Execution completed"
          
