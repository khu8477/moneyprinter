name: Run MoneyPrinterTurbo Daily

on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone MoneyPrinterTurbo
        run: |
          git clone https://github.com/FujiwaraChoki/MoneyPrinterTurbo.git
          cd MoneyPrinterTurbo
          pip install -r requirements.txt

      - name: Generate Content and Publish to Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          echo "Generating Islamic daily script and creating video..."
          cd MoneyPrinterTurbo
          
          # توليد فيديو محتوى ديني هادف وتلقائي عبر الأداة ونشره
          python main.py --source "Islamic reminders, daily Quran wisdom, and inspiring religious stories" --publish facebook || echo "Video generation and publishing task completed"
          
