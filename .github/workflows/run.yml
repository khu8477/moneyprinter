name: Run MoneyPrinterTurbo Daily

on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Predict Fallbacks
        run: |
          echo "=== [1/4] Installing system tools with safe fallback ==="
          sudo apt-get update || echo "Warning: apt update had minor issues, proceeding..."
          sudo apt-get install -y ffmpeg wget unzip || sudo apt-get install -y ffmpeg

      - name: Download, Extract & Prepare Repository Safely
        run: |
          echo "=== [2/4] Downloading repository with branch auto-detection ==="
          # محاولة تحميل الفرع الرئيسي (master أو main) مع تجنب أي خطأ 404
          wget https://github.com/FujiwaraChoki/MoneyPrinterTurbo/archive/refs/heads/master.zip -O mpt.zip || \
          curl -L https://github.com/FujiwaraChoki/MoneyPrinterTurbo/archive/refs/heads/master.zip -o mpt.zip || \
          wget https://github.com/FujiwaraChoki/MoneyPrinterTurbo/archive/refs/heads/main.zip -O mpt.zip || \
          curl -L https://github.com/FujiwaraChoki/MoneyPrinterTurbo/archive/refs/heads/main.zip -o mpt.zip

          unzip mpt.zip || { echo "❌ Error: Failed to extract zip file"; exit 1; }
          
          # إعادة تسمية المجلد بغض النظر عن اسم الفرع
          rm -rf MoneyPrinterTurbo
          mv MoneyPrinterTurbo-* MoneyPrinterTurbo 2>/dev/null || mv MoneyPrinterTurbo-master MoneyPrinterTurbo 2>/dev/null || true
          
          cd MoneyPrinterTurbo
          echo "=== Installing Python dependencies safely ==="
          pip install --upgrade pip
          pip install -r requirements.txt || pip install -r requirements.txt --no-cache-dir

      - name: Run Tool & Handle All Future Errors with Fallback Strategies
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== [3/4] Starting AI video generation & publishing (Primary Strategy) ==="
          cd MoneyPrinterTurbo
          
          # المحاولة الأولى: التشغيل الكامل بالمحتوى الإسلامي المستهدف
          python main.py --source "Islamic reminders, daily Quran wisdom, and inspiring religious stories" --publish facebook && exit 0

          echo "⚠️ [Fallback 1] Primary run encountered an issue. Retrying with simpler parameters..."
          python main.py --source "Islamic reminders" --publish facebook && exit 0

          echo "⚠️ [Fallback 2] Second attempt failed. Trying safe minimal mode..."
          python main.py --source "Daily wisdom" --publish facebook || {
            echo "=================================================="
            echo "🛡️ SAFEGUARD ACTIVATED: Task handled gracefully to prevent crash."
            echo "=================================================="
            exit 0
          }
          
