name: Run MoneyPrinterTurbo Daily

on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone MoneyPrinterTurbo
        run: |
          git clone https://github.com/FujiwaraChoki/MoneyPrinterTurbo.git
          cd MoneyPrinterTurbo
          pip install -r requirements.txt

      - name: Run Tool
        run: |
          echo "Here we will run the tool and publish to Facebook"
