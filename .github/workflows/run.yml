name: Run MoneyPrinterTurbo Daily

on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Clone MoneyPrinterTurbo and Install Python Requirements
        run: |
          git clone https://github.com/FujiwaraChoki/MoneyPrinterTurbo.git
          cd MoneyPrinterTurbo
          pip install -r requirements.txt

      - name: Run Tool with Detailed Error Diagnostics
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=== Starting Detailed Diagnostics Run == "
          cd MoneyPrinterTurbo
          # تشغيل مع كاشف أخطاء مفصل يطبع أي مشكلة تحدث أثناء التنفيذ
          python main.py --source "Islamic reminders, daily Quran wisdom, and inspiring religious stories" --publish facebook || {
            EXIT_CODE=$?
            echo "=========================================="
            echo "❌ ERROR DETECTED! Exit code: $EXIT_CODE"
            echo "=========================================="
            exit $EXIT_CODE
          }
          
