name: MoneyPrinter Auto Publisher

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو (اختياري)"
        required: false
      publish_mode:
        description: "draft = مسودة للمراجعة | public = نشر مباشر"
        default: "draft"
        type: choice
        options: [draft, public]

permissions:
  contents: read

concurrency:
  group: money-printer
  cancel-in-progress: false

env:
  MPT_REPO: https://github.com/harry0703/MoneyPrinterTurbo.git
  GIT_TERMINAL_PROMPT: "0"

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -Eeuo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          trap 'echo "::error title=System deps failed::فشل الأمر: $BASH_COMMAND"' ERR
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick unzip curl

      - name: Clone MoneyPrinterTurbo
        run: |
          trap 'echo "::error title=Clone failed::فشل الأمر: $BASH_COMMAND"' ERR
          if ! git ls-remote --exit-code "$MPT_REPO" HEAD >/dev/null 2>&1; then
            echo "::error title=Repo not found::المستودع غير موجود: $MPT_REPO"
            exit 1
          fi
          for attempt in 1 2 3; do
            rm -rf MoneyPrinterTurbo
            if git clone --depth 1 "$MPT_REPO" MoneyPrinterTurbo; then exit 0; fi
            echo "::warning::محاولة $attempt فشلت"
            sleep $((attempt * 5))
          done
          echo "::error title=Clone failed::فشل الاستنساخ بعد 3 محاولات"
          exit 1

      - name: Install Python requirements
        working-directory: MoneyPrinterTurbo
        run: |
          trap 'echo "::error title=pip failed::فشل الأمر: $BASH_COMMAND"' ERR
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install -r requirements.txt; then exit 0; fi
            echo "::warning::pip محاولة $attempt فشلت"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run Tool and Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          PUBLISH_MODE: ${{ github.event.inputs.publish_mode || 'draft' }}
        run: |
          cat > run_and_publish.py <<'PY'
          import os, re, sys, time, pathlib, subprocess, traceback, datetime
          import requests

          ROOT = pathlib.Path(__file__).resolve().parent
          MPT = ROOT / "MoneyPrinterTurbo"
          LOGS = ROOT / "logs"
          LOGS.mkdir(exist_ok=True)
          API = "http://127.0.0.1:8080"
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")
          GEM = "https://generativelanguage.googleapis.com/v1beta/models"


          # ---------- إظهار مكان الخطأ ----------
          def report_error(exc_type, exc, tb):
              frames = traceback.extract_tb(tb)
              mine = [f for f in frames if str(ROOT) in f.filename] or frames
              last = mine[-1]
              msg = f"{exc_type.__name__}: {exc}".replace("\n", " ")
              print(f"::error file=run_and_publish.py,line={last.lineno},title=Script failed::{msg}")
              full = "".join(traceback.format_exception(exc_type, exc, tb))
              print(full)
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as s:
                      s.write("## ❌ فشل التشغيل\n")
                      s.write(f"- **السطر في السكربت:** `{last.lineno}`\n")
                      s.write(f"- **الدالة:** `{last.name}`\n- **الكود:** `{last.line}`\n")
                      s.write(f"- **الخطأ:** `{msg}`\n\n```\n{full}\n```\n")
              (LOGS / "error.txt").write_text(full, encoding="utf-8")


          sys.excepthook = report_error


          def log(msg):
              print(f"[{datetime.datetime.now():%H:%M:%S}] {msg}", flush=True)


          def need(name):
              val = os.environ.get(name, "").strip()
              if not val:
                  raise RuntimeError(f"السر {name} غير موجود أو فارغ في GitHub Secrets")
              return val


          # ---------- إعداد الأداة (Pexels) ----------
          def set_toml(text, key, value):
              pattern = rf'^{re.escape(key)}\s*=.*$'
              line = f'{key} = "{value}"'
              if re.search(pattern, text, flags=re.M):
                  return re.sub(pattern, lambda m: line, text, count=1, flags=re.M)
              return text + f"\n{line}\n"


          def prepare_config():
              src, dst = MPT / "config.example.toml", MPT / "config.toml"
              text = src.read_text(encoding="utf-8")
              pexels = need("PEXELS_API_KEY")
              text = re.sub(r'^pexels_api_keys\s*=.*$',
                            lambda m: f'pexels_api_keys = ["{pexels}"]',
                            text, count=1, flags=re.M)
              text = set_toml(text, "video_source", "pexels")
              dst.write_text(text, encoding="utf-8")
              log("config.toml جاهز (pexels)")


          # ---------- تشغيل السيرفر ----------
          def start_server():
              logf = open(LOGS / "server.log", "w", encoding="utf-8")
              proc = subprocess.Popen([sys.executable, "main.py"], cwd=MPT,
                                      stdout=logf, stderr=subprocess.STDOUT)
              for _ in range(60):
                  if proc.poll() is not None:
                      raise RuntimeError("السيرفر توقف عند التشغيل، راجع logs/server.log")
                  try:
                      if requests.get(f"{API}/docs", timeout=2).status_code == 200:
                          log("السيرفر يعمل")
                          return proc
                  except requests.RequestException:
                      pass
                  time.sleep(2)
              proc.kill()
              raise TimeoutError("السيرفر لم يبدأ خلال دقيقتين")


          # ---------- Gemini (اختيار النموذج تلقائياً) ----------
          _models = []


          def pick_models(key):
              if _models:
                  return _models
              r = requests.get(GEM, params={"key": key, "pageSize": 100}, timeout=30)
              r.raise_for_status()
              names = [m["name"].split("/")[-1] for m in r.json().get("models", [])
                       if "generateContent" in m.get("supportedGenerationMethods", [])]
              log(f"النماذج المتاحة: {names}")
              good = [n for n in names if "flash" in n
                      and not any(x in n for x in ("image", "tts", "live", "audio", "thinking", "exp", "preview"))]
              good.sort(reverse=True)
              rest = [n for n in names if n not in good and "flash" in n]
              if not (good or rest):
                  raise RuntimeError(f"لا يوجد نموذج flash متاح لمفتاحك. المتاح: {names}")
              _models.extend((good + rest)[:4])
              return _models


          def gemini(prompt, min_len=5):
              key = need("GEMINI_API_KEY")
              last = None
              for model in pick_models(key):
                  for attempt in range(2):
                      try:
                          r = requests.post(f"{GEM}/{model}:generateContent", params={"key": key},
                                            timeout=90,
                                            json={"contents": [{"parts": [{"text": prompt}]}]})
                          r.raise_for_status()
                          text = r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                          if len(text) >= min_len:
                              return text
                          last = "نص قصير أو فارغ"
                      except Exception as e:
                          last = f"{model}: {e}"
                      log(f"فشلت المحاولة ({model}): {last}")
                      time.sleep(4)
              raise RuntimeError(f"فشل Gemini بكل النماذج. آخر خطأ: {last}")


          def write_script(topic):
              prompt = (f"اكتب نصا قصيرا بالعربية الفصحى (نحو 80 كلمة) عن: {topic}. "
                        "اسلوب تاملي هادئ. لا تذكر اي اية او حديث او نسبة قول لاحد. "
                        "اكتب النص فقط دون عنوان.")
              return gemini(prompt, min_len=50)


          def make_terms(topic, default):
              try:
                  t = gemini(f"Give 5 English keywords for stock nature or sky footage matching "
                             f"the theme: {topic}. Comma-separated, nothing else.")
                  t = re.sub(r"[^A-Za-z, ]", "", t).strip(" ,")
                  return t or default
              except Exception as e:
                  log(f"تعذر توليد الكلمات المفتاحية: {e}")
                  return default


          # ---------- المواضيع البديلة (تُستخدم إذا لم يوجد فيديو) ----------
          FALLBACKS = [
              ("فضل الاستغفار", "nature, sky, calm"),
              ("جمال التأمل في خلق الله", "ocean, mountains, sunrise"),
              ("الصبر وحسن الظن بالله", "forest, river, clouds"),
              ("شكر النعم", "sunset, flowers, garden"),
          ]

          TIERS = [
              {"name": "full", "paragraph_number": 3},
              {"name": "medium", "paragraph_number": 2},
              {"name": "economy", "paragraph_number": 1},
          ]


          class TaskFailed(Exception):
              def __init__(self, stage, detail):
                  super().__init__(f"المهمة فشلت (المرحلة: {stage}): {detail}")
                  self.stage = stage


          def wait_for_task(task_id, timeout=1500):
              start = time.time()
              while time.time() - start < timeout:
                  d = requests.get(f"{API}/api/v1/tasks/{task_id}", timeout=30).json()["data"]
                  state = d.get("state")
                  log(f"state={state} progress={d.get('progress')}")
                  if state == 1:
                      videos = d.get("videos") or []
                      if not videos:
                          raise TaskFailed("output", "المهمة اكتملت بدون ملف فيديو")
                      out = LOGS / f"{task_id}.mp4"
                      if videos[0].startswith("http"):
                          with requests.get(videos[0], stream=True, timeout=120) as r:
                              r.raise_for_status()
                              with open(out, "wb") as f:
                                  for chunk in r.iter_content(1 << 20):
                                      f.write(chunk)
                      else:
                          out.write_bytes(pathlib.Path(videos[0]).read_bytes())
                      return out
                  if state == -1:
                      raise TaskFailed(d.get("failed_stage") or "unknown",
                                       d.get("error") or str(d)[:400])
                  time.sleep(10)
              raise TimeoutError("انتهت مهلة انتظار الفيديو")


          # ---------- توليد الفيديو: إن لم يوجد فيديو يغيّر الموضوع ----------
          def generate_video(first_topic):
              candidates = [(first_topic, None)] + FALLBACKS
              last_err = None
              for topic, default_terms in candidates:
                  log(f"الموضوع: {topic}")
                  script = write_script(topic)
                  terms = make_terms(topic, default_terms or "nature, sky, calm")
                  log(f"كلمات البحث: {terms}")
                  for tier in TIERS:
                      log(f"محاولة بخطة: {tier['name']}")
                      body = {
                          "video_subject": topic,
                          "video_script": script,
                          "video_terms": terms,
                          "video_language": "ar",
                          "voice_name": os.environ.get("VOICE_NAME", "ar-SA-HamedNeural-Male"),
                          "video_aspect": "9:16",
                          "video_source": "pexels",
                          "paragraph_number": tier["paragraph_number"],
                          "video_count": 1,
                      }
                      try:
                          r = requests.post(f"{API}/api/v1/videos", json=body, timeout=60)
                          r.raise_for_status()
                          return wait_for_task(r.json()["data"]["task_id"]), topic
                      except TaskFailed as e:
                          last_err = e
                          log(f"فشلت خطة {tier['name']}: {e}")
                          if e.stage == "materials":
                              log("لم يوجد فيديو/صورة مناسبة، تغيير الموضوع...")
                              break
                      except Exception as e:
                          last_err = e
                          log(f"فشلت خطة {tier['name']}: {e}")
              raise RuntimeError(f"فشلت كل المواضيع والخطط. آخر خطأ: {last_err}")


          # ---------- النشر على فيسبوك ----------
          def publish(video_path, topic):
              page_id, token = need("FB_PAGE_ID"), need("FB_PAGE_TOKEN")
              published = "true" if os.environ.get("PUBLISH_MODE") == "public" else "false"
              with open(video_path, "rb") as f:
                  r = requests.post(
                      f"https://graph.facebook.com/v21.0/{page_id}/videos",
                      data={"access_token": token, "description": topic, "published": published},
                      files={"source": f}, timeout=600)
              if r.status_code != 200:
                  raise RuntimeError(f"Facebook API {r.status_code}: {r.text}")
              log(f"تم الرفع ({'نشر مباشر' if published == 'true' else 'مسودة'}): {r.json()}")


          def main():
              for n in ("FB_PAGE_ID", "FB_PAGE_TOKEN", "GEMINI_API_KEY", "PEXELS_API_KEY"):
                  need(n)
              topic = os.environ.get("VIDEO_TOPIC", "").strip() or "فضل الذكر والاستغفار"
              prepare_config()
              server = start_server()
              try:
                  video, used_topic = generate_video(topic)
                  publish(video, used_topic)
              finally:
                  server.terminate()
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as s:
                      s.write(f"## ✅ تم بنجاح\n- الموضوع المستخدم: {used_topic}\n")


          if __name__ == "__main__":
              main()
          PY
          python run_and_publish.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
