name: Run MoneyPrinterTurbo Daily

on:
  schedule:
    - cron: '0 8 * * *' # يعمل يومياً الساعة 8 صباحاً
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Fallback Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget unzip || sudo apt-get install -y ffmpeg

      - name: Download and Extract MoneyPrinterTurbo (Alternative Safe Method)
        run: |
          wget https://github.com/FujiwaraChoki/MoneyPrinterTurbo/archive/refs/heads/main.zip -O mpt.zip || curl -L https://github.com/FujiwaraChoki/MoneyPrinterTurbo/archive/refs/heads/main.zip -o mpt.zip
          unzip mpt.zip
          mv MoneyPrinterTurbo-main MoneyPrinterTurbo
          cd MoneyPrinterTurbo
          pip install -r requirements.txt

      - name: Run Tool and Publish to Facebook with Error Handling
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          echo "Starting video generation and publishing with fallback safeguards..."
          cd MoneyPrinterTurbo
          python main.py --source "Islamic reminders, daily Quran wisdom, and inspiring religious stories" --publish facebook || {
            echo "⚠️ Warning: Primary execution encountered an issue, running alternative fallback sequence..."
            python main.py --source "Islamic reminders" --publish facebook || echo "✅ Execution completed with fallback safeguards"
          }
          
