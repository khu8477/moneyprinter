name: MoneyPrinter Daily Publisher

on:
  schedule:
    - cron: "17 9 * * *"     # مرة يومياً 09:17 UTC (10:17 بتوقيت المغرب)
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو (اتركه فارغاً ليُختار تلقائياً)"
        required: false
      publish_mode:
        description: "draft = مسودة | public = نشر علني"
        default: "draft"
        type: choice
        options: [draft, public]

permissions:
  contents: read

concurrency:
  group: money-printer
  cancel-in-progress: false

env:
  MPT_REPO: https://github.com/harry0703/MoneyPrinterTurbo.git
  GIT_TERMINAL_PROMPT: "0"

jobs:
  run-money-printer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -Eeuo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          trap 'echo "::error title=System deps failed::فشل الأمر: $BASH_COMMAND"' ERR
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick unzip curl

      - name: Clone MoneyPrinterTurbo
        run: |
          trap 'echo "::error title=Clone failed::فشل الأمر: $BASH_COMMAND"' ERR
          if ! git ls-remote --exit-code "$MPT_REPO" HEAD >/dev/null 2>&1; then
            echo "::error title=Repo not found::المستودع غير موجود: $MPT_REPO"
            exit 1
          fi
          for attempt in 1 2 3; do
            rm -rf MoneyPrinterTurbo
            if git clone --depth 1 "$MPT_REPO" MoneyPrinterTurbo; then exit 0; fi
            echo "::warning::محاولة $attempt فشلت"
            sleep $((attempt * 5))
          done
          echo "::error title=Clone failed::فشل الاستنساخ بعد 3 محاولات"
          exit 1

      - name: Install Python requirements
        working-directory: MoneyPrinterTurbo
        run: |
          trap 'echo "::error title=pip failed::فشل الأمر: $BASH_COMMAND"' ERR
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if pip install -r requirements.txt; then exit 0; fi
            echo "::warning::pip محاولة $attempt فشلت"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate Video and Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          PUBLISH_MODE: ${{ github.event.inputs.publish_mode || 'public' }}
        run: |
          cat > run_and_publish.py <<'PY'
          import os, re, sys, time, pathlib, subprocess, traceback, datetime
          import requests

          ROOT = pathlib.Path(__file__).resolve().parent
          MPT = ROOT / "MoneyPrinterTurbo"
          LOGS = ROOT / "logs"
          LOGS.mkdir(exist_ok=True)
          API = "http://127.0.0.1:8080"
          GEM = "https://generativelanguage.googleapis.com/v1beta/models"
          FB = "https://graph.facebook.com/v21.0"
          TG = "https://api.telegram.org"
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")


          # =====================================================
          #   قسم المحتوى: عدّل هذا القسم فقط لتغيير نوع المحتوى
          # =====================================================

          # (الموضوع بالعربية، كلمات بحث الفيديو بالإنجليزية)
          TOPICS = [
              ("جمال الطبيعة من حولنا", "nature, mountains, forest, sunlight"),
              ("أهمية الصبر في الحياة", "river, rain, forest, peaceful"),
              ("قيمة الوقت", "clock, timelapse, sky, clouds"),
              ("الامتنان لما نملك", "flowers, garden, sunset, golden"),
              ("الهدوء والسكينة", "lake, mist, mountains, serene"),
              ("التفاؤل بيوم جديد", "sunrise, hills, light, morning"),
              ("الإصرار على تحقيق الأهداف", "mountain, climbing, peak, sky"),
              ("متعة التعلم كل يوم", "books, library, light, calm"),
              ("قوة الابتسامة", "sunshine, field, flowers, bright"),
              ("أهمية الصدق في التعامل", "river, mountains, morning, clear"),
              ("الاستمتاع بالأشياء البسيطة", "meadow, breeze, trees, fresh"),
              ("التعاون وروح الفريق", "birds, flock, sky, sunset"),
              ("الشجاعة في مواجهة التحديات", "ocean, waves, rocks, storm"),
              ("بداية جديدة كل صباح", "sunrise, sea, horizon, calm"),
          ]

          # أسلوب النص (يمكنك تغييره لاحقاً)
          CONTENT_STYLE = ("أسلوب تحفيزي هادئ ومؤثر وبسيط. "
                           "لا تذكر اي ايات او احاديث او اقتباسات منسوبة لاي شخص. "
                           "لا تذكر ارقاما او احصاءات او معلومات طبية او سياسية.")
          WORDS = 60
          HASHTAGS = "#تحفيز #تأملات #طبيعة #إيجابية"

          # =====================================================


          # ---------- إخفاء الأسرار من السجلات والرسائل ----------
          SECRET_NAMES = ("FB_PAGE_TOKEN", "GEMINI_API_KEY", "PEXELS_API_KEY", "TG_BOT_TOKEN")


          def redact(text):
              text = str(text)
              for name in SECRET_NAMES:
                  val = os.environ.get(name, "").strip()
                  if val:
                      text = text.replace(val, "***")
              return text


          # ---------- تيليغرام ----------
          def _tg_creds():
              return (os.environ.get("TG_BOT_TOKEN", "").strip(),
                      os.environ.get("TG_CHAT_ID", "").strip())


          def tg_send(text):
              token, chat = _tg_creds()
              if not token or not chat:
                  return False
              try:
                  r = requests.post(f"{TG}/bot{token}/sendMessage",
                                    data={"chat_id": chat, "text": redact(text)[:4000]},
                                    timeout=30)
                  return r.status_code == 200
              except Exception as e:
                  print(redact(f"تعذر إرسال رسالة تيليغرام: {e}"))
                  return False


          def tg_video(path, caption):
              token, chat = _tg_creds()
              if not token or not chat:
                  log("تيليغرام غير مفعّل (TG_BOT_TOKEN/TG_CHAT_ID غير موجودين)")
                  return False
              if path.stat().st_size > 50 * 1024 * 1024:  # حد البوتات 50MB
                  tg_send(caption + "\n\n(الفيديو أكبر من 50MB فلم يُرسل)")
                  return False
              try:
                  with open(path, "rb") as f:
                      r = requests.post(f"{TG}/bot{token}/sendVideo",
                                        data={"chat_id": chat,
                                              "caption": redact(caption)[:1024],
                                              "supports_streaming": "true"},
                                        files={"video": f}, timeout=600)
                  if r.status_code == 200:
                      log("تم إرسال الفيديو إلى تيليغرام")
                      return True
                  log(f"فشل إرسال الفيديو لتيليغرام {r.status_code}: {r.text[:200]}")
              except Exception as e:
                  log(f"فشل إرسال الفيديو لتيليغرام: {e}")
              return False


          # ---------- إظهار مكان الخطأ ----------
          def report_error(exc_type, exc, tb):
              frames = traceback.extract_tb(tb)
              mine = [f for f in frames if str(ROOT) in f.filename] or frames
              last = mine[-1]
              msg = redact(f"{exc_type.__name__}: {exc}".replace("\n", " "))
              print(f"::error file=run_and_publish.py,line={last.lineno},title=Script failed::{msg[:900]}")
              full = redact("".join(traceback.format_exception(exc_type, exc, tb)))
              print(full)
              tg_send(f"❌ فشل التشغيل\nالسطر: {last.lineno} ({last.name})\n{msg[:600]}")
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as s:
                      s.write("## ❌ فشل التشغيل\n")
                      s.write(f"- **السطر في السكربت:** `{last.lineno}`\n")
                      s.write(f"- **الدالة:** `{last.name}`\n- **الكود:** `{redact(last.line)}`\n")
                      s.write(f"- **الخطأ:** `{msg[:900]}`\n\n```\n{full}\n```\n")
              (LOGS / "error.txt").write_text(full, encoding="utf-8")


          sys.excepthook = report_error


          def log(msg):
              print(redact(f"[{datetime.datetime.now():%H:%M:%S}] {msg}"), flush=True)


          def need(name):
              val = os.environ.get(name, "").strip()
              if not val:
                  raise RuntimeError(f"السر {name} غير موجود أو فارغ في GitHub Secrets")
              return val


          def todays_topics(custom):
              start = datetime.date.today().toordinal() % len(TOPICS)
              rotated = TOPICS[start:] + TOPICS[:start]
              return ([(custom, None)] + rotated) if custom else rotated


          # ---------- إعداد الأداة (Pexels) ----------
          def set_toml(text, key, value):
              pattern = rf'^{re.escape(key)}\s*=.*$'
              line = f'{key} = "{value}"'
              if re.search(pattern, text, flags=re.M):
                  return re.sub(pattern, lambda m: line, text, count=1, flags=re.M)
              return text + f"\n{line}\n"


          def prepare_config():
              src, dst = MPT / "config.example.toml", MPT / "config.toml"
              text = src.read_text(encoding="utf-8")
              pexels = need("PEXELS_API_KEY")
              text = re.sub(r'^pexels_api_keys\s*=.*$',
                            lambda m: f'pexels_api_keys = ["{pexels}"]',
                            text, count=1, flags=re.M)
              text = set_toml(text, "video_source", "pexels")
              dst.write_text(text, encoding="utf-8")
              log("config.toml جاهز (pexels)")


          # ---------- فحص مبكر لفيسبوك ----------
          def check_facebook():
              page_id, token = need("FB_PAGE_ID"), need("FB_PAGE_TOKEN")
              r = requests.get(f"{FB}/{page_id}", params={"fields": "name", "access_token": token}, timeout=30)
              if r.status_code != 200:
                  hint = ""
                  if "expired" in r.text.lower() or "OAuthException" in r.text:
                      hint = " (التوكن منتهي أو غير صالح: أنشئ توكن صفحة طويل الأمد)"
                  raise RuntimeError(f"فحص فيسبوك فشل {r.status_code}: {r.text[:300]}{hint}")
              log(f"فيسبوك: الصفحة المتصلة = {r.json().get('name')}")


          # ---------- تشغيل السيرفر ----------
          def start_server():
              logf = open(LOGS / "server.log", "w", encoding="utf-8")
              proc = subprocess.Popen([sys.executable, "main.py"], cwd=MPT,
                                      stdout=logf, stderr=subprocess.STDOUT)
              for _ in range(60):
                  if proc.poll() is not None:
                      raise RuntimeError("السيرفر توقف عند التشغيل، راجع logs/server.log")
                  try:
                      if requests.get(f"{API}/docs", timeout=2).status_code == 200:
                          log("السيرفر يعمل")
                          return proc
                  except requests.RequestException:
                      pass
                  time.sleep(2)
              proc.kill()
              raise TimeoutError("السيرفر لم يبدأ خلال دقيقتين")


          # ---------- Gemini ----------
          _models = []
          PREFERRED = ["gemini-flash-latest", "gemini-2.5-flash", "gemini-flash-lite-latest",
                       "gemini-2.5-flash-lite"]


          def pick_models(key):
              if _models:
                  return _models
              r = requests.get(GEM, params={"key": key, "pageSize": 200}, timeout=30)
              r.raise_for_status()
              names = [m["name"].split("/")[-1] for m in r.json().get("models", [])
                       if "generateContent" in m.get("supportedGenerationMethods", [])]
              chosen = [n for n in PREFERRED if n in names]
              extra = [n for n in names if "flash" in n and n not in chosen
                       and not any(x in n for x in ("image", "tts", "live", "audio", "omni",
                                                    "thinking", "exp", "preview", "robotics",
                                                    "transcribe", "banana"))]
              _models.extend((chosen + sorted(extra, reverse=True))[:5])
              if not _models:
                  raise RuntimeError(f"لا يوجد نموذج flash متاح لمفتاحك. المتاح: {names}")
              log(f"نماذج Gemini المستخدمة: {_models}")
              return _models


          def gemini(prompt, min_len=5):
              key = need("GEMINI_API_KEY")
              last = None
              for model in pick_models(key):
                  for attempt in range(2):
                      try:
                          r = requests.post(f"{GEM}/{model}:generateContent", params={"key": key},
                                            timeout=90,
                                            json={"contents": [{"parts": [{"text": prompt}]}]})
                          r.raise_for_status()
                          text = r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                          if len(text) >= min_len:
                              return text
                          last = "نص قصير أو فارغ"
                      except Exception as e:
                          last = f"{model}: {e}"
                      log(f"فشلت المحاولة ({model}): {last}")
                      time.sleep(4)
              raise RuntimeError(f"فشل Gemini بكل النماذج. آخر خطأ: {last}")


          def write_script(topic):
              prompt = (f"اكتب نصا قصيرا بالعربية الفصحى (نحو {WORDS} كلمة) عن: {topic}. "
                        f"{CONTENT_STYLE} اكتب النص فقط دون عنوان ودون رموز.")
              return gemini(prompt, min_len=40)


          def make_terms(topic, default):
              try:
                  t = gemini("Give 5 English keywords for stock nature footage matching "
                             f"the theme: {topic}. Comma-separated, nothing else.")
                  t = re.sub(r"[^A-Za-z, ]", "", t).strip(" ,")
                  return t or default or "nature, sky, calm"
              except Exception as e:
                  log(f"تعذر توليد الكلمات المفتاحية: {e}")
                  return default or "nature, sky, calm"


          # ---------- انتظار المهمة وتحميل الفيديو ----------
          class TaskFailed(Exception):
              def __init__(self, stage, detail):
                  super().__init__(f"المهمة فشلت (المرحلة: {stage}): {detail}")
                  self.stage = stage


          def fetch_video(path, task_id, out):
              if path.startswith("http"):
                  urls = [path]
              else:
                  rel = path if path.startswith("/") else "/" + path
                  urls = [f"{API}{rel}", f"{API}/api/v1/download{rel}"]
              errs = []
              for u in urls:
                  try:
                      with requests.get(u, stream=True, timeout=180) as r:
                          r.raise_for_status()
                          with open(out, "wb") as f:
                              for chunk in r.iter_content(1 << 20):
                                  f.write(chunk)
                      if out.stat().st_size > 10000:
                          return
                  except Exception as e:
                      errs.append(f"{u}: {e}")
              rel = path.lstrip("/")
              for p in (MPT / rel, MPT / "storage" / rel, pathlib.Path(path)):
                  if p.is_file() and p.stat().st_size > 10000:
                      out.write_bytes(p.read_bytes())
                      return
              found = [p for p in MPT.rglob("final-*.mp4") if task_id in str(p)]
              if found:
                  out.write_bytes(found[0].read_bytes())
                  return
              raise TaskFailed("download", f"تعذر العثور على الفيديو: {path} | {errs}")


          def wait_for_task(task_id, timeout=1800):
              start = time.time()
              last_log = 0
              while time.time() - start < timeout:
                  d = requests.get(f"{API}/api/v1/tasks/{task_id}", timeout=30).json()["data"]
                  state = d.get("state")
                  if time.time() - last_log > 30:
                      log(f"state={state} progress={d.get('progress')}")
                      last_log = time.time()
                  if state == 1:
                      videos = d.get("videos") or []
                      if not videos:
                          raise TaskFailed("output", "المهمة اكتملت بدون ملف فيديو")
                      out = LOGS / f"{task_id}.mp4"
                      fetch_video(videos[0], task_id, out)
                      return out
                  if state == -1:
                      raise TaskFailed(d.get("failed_stage") or "unknown",
                                       d.get("error") or str(d)[:400])
                  time.sleep(10)
              raise TimeoutError("انتهت مهلة انتظار الفيديو")


          # ---------- توليد الفيديو: تغيير الموضوع إن لم يوجد فيديو/صورة ----------
          def generate_video(topics):
              last_err = None
              for topic, default_terms in topics[:5]:
                  log(f"الموضوع: {topic}")
                  script = write_script(topic)
                  terms = make_terms(topic, default_terms)
                  log(f"كلمات البحث: {terms}")
                  for attempt in (1, 2):
                      log(f"محاولة التوليد رقم {attempt}")
                      body = {
                          "video_subject": topic,
                          "video_script": script,
                          "video_terms": terms,
                          "video_language": "ar",
                          "voice_name": os.environ.get("VOICE_NAME", "ar-SA-HamedNeural-Male"),
                          "video_aspect": "9:16",
                          "video_source": "pexels",
                          "paragraph_number": 1,
                          "video_count": 1,
                      }
                      try:
                          r = requests.post(f"{API}/api/v1/videos", json=body, timeout=60)
                          r.raise_for_status()
                          return wait_for_task(r.json()["data"]["task_id"]), topic, script
                      except TaskFailed as e:
                          last_err = e
                          log(f"فشلت المحاولة: {e}")
                          if e.stage == "materials":
                              log("لم يوجد فيديو/صورة مناسبة، تغيير الموضوع...")
                              break
                          if e.stage == "download":
                              raise
                      except Exception as e:
                          last_err = e
                          log(f"فشلت المحاولة: {e}")
              raise RuntimeError(f"فشلت كل المواضيع والمحاولات. آخر خطأ: {last_err}")


          # ---------- النشر على فيسبوك ----------
          def publish(video_path, topic, script):
              page_id, token = need("FB_PAGE_ID"), need("FB_PAGE_TOKEN")
              public = os.environ.get("PUBLISH_MODE", "public") == "public"
              description = f"{topic}\n\n{script}\n\n{HASHTAGS}"
              last = None
              for attempt in range(3):
                  try:
                      with open(video_path, "rb") as f:
                          r = requests.post(
                              f"{FB}/{page_id}/videos",
                              data={"acc
